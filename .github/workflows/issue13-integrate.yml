name: Issue 13 integrate

on:
  push:
    branches:
      - issue-13-calibration-profile-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-13-calibration-profile-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue13_patch.py
      - run: python scripts/issue13_compat.py
      - run: npm run format
      - run: npm run typecheck
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/state/appState.ts src/audio/AudioEngine.ts src/app/App.tsx src/styles/base.css
          git commit -m "feat: integrate bounded calibration profiles"
          git push origin HEAD:issue-13-calibration-profile-pipeline
