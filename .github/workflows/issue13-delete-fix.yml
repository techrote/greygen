name: Issue 13 deletion fix

on:
  push:
    branches:
      - issue-13-calibration-profile-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-13-calibration-profile-pipeline
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue13_delete_fix.py
      - run: npm run format
      - run: npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "fix: preserve profile deletion semantics"
          git push origin HEAD:issue-13-calibration-profile-pipeline
