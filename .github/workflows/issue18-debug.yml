name: Issue 18 browser diagnostics

on:
  push:
    branches:
      - issue-18-accessibility-responsive

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture browser output
        shell: bash
        run: npm run test:e2e > issue18-e2e.log 2>&1 || true
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue18-e2e.log
          git commit -m "chore: browser diagnostics output" || exit 0
          git push
