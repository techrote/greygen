name: Issue 18 browser diagnostics helper

on:
  push:
    branches:
      - issue-18-accessibility-responsive

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, 'browser diagnostics output') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-18-accessibility-responsive
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture browser tests
        shell: bash
        run: |
          set +e
          npm run test:e2e > issue18-e2e.log 2>&1
          status=$?
          echo "exit_status=$status" >> issue18-e2e.log
          exit 0
      - name: Commit diagnostics output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add issue18-e2e.log
          git commit -m "chore: browser diagnostics output"
          git push origin HEAD:issue-18-accessibility-responsive
