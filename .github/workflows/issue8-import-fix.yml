name: Issue 8 import cleanup

on:
  push:
    branches:
      - issue-8-versioned-state-persistence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-8-versioned-state-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Normalize type-only import
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/App.tsx')
          source = path.read_text()
          old = "import { type SpectralPresetId, type SpectrumState } from '../audio/dsp/spectra'"
          new = "import type { SpectralPresetId, SpectrumState } from '../audio/dsp/spectra'"
          if old not in source:
              raise SystemExit('type-only import anchor not found')
          path.write_text(source.replace(old, new, 1))
          PY
          npm run format
          npm run lint
          npm run typecheck
      - name: Commit import cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "chore: normalize persisted-state type import"
          git push origin HEAD:issue-8-versioned-state-persistence
