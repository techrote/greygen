name: Issue 14 lint fix

on:
  push:
    branches:
      - issue-14-guided-calibration-wizard

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-14-guided-calibration-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue14_lint_fix.py
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/calibration/GuidedCalibrationWizard.tsx e2e/guided-calibration.spec.ts src/styles/base.css
          git commit -m "fix: make guided calibration controls lint-clean"
          git push origin HEAD:issue-14-guided-calibration-wizard
