name: Issue 8 style pass

on:
  push:
    branches:
      - issue-8-versioned-state-persistence

permissions:
  contents: write

jobs:
  style:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-8-versioned-state-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Style local-state surface
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/base.css')
          source = path.read_text()
          cards = '.transport-card,\n.generator-card,\n.output-card,\n.future-card {'
          cards_new = '.transport-card,\n.generator-card,\n.output-card,\n.future-card,\n.state-card {'
          if cards not in source:
              raise SystemExit('card selector anchor not found')
          source = source.replace(cards, cards_new, 1)
          anchor = '.sr-only {'
          addition = '''.panel-toggle {
            width: auto;
          }

          .profile-count {
            color: #aeb8a6;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
          }

          .storage-notice {
            margin: 0.8rem 0 0;
            padding: 0.7rem 0.8rem;
            border: 1px solid rgba(216, 190, 130, 0.32);
            border-radius: 0.6rem;
            color: #d8cfb7;
            background: rgba(90, 76, 42, 0.18);
            font-size: 0.88rem;
            line-height: 1.5;
          }

          .state-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 1rem;
          }

          button.danger-action {
            border-color: rgba(214, 154, 143, 0.45);
            color: #f0c3bb;
            background: rgba(92, 46, 41, 0.28);
          }

          button.danger-action:hover:not(:disabled) {
            background: rgba(112, 54, 48, 0.42);
          }

          '''
          if anchor not in source:
              raise SystemExit('sr-only anchor not found')
          source = source.replace(anchor, addition + anchor, 1)
          narrow = '  .reset-all {\n    width: 100%;\n  }'
          narrow_new = '''  .reset-all,
            .panel-toggle {
              width: 100%;
            }

            .state-actions {
              display: grid;
              grid-template-columns: 1fr;
            }'''
          if narrow not in source:
              raise SystemExit('narrow layout anchor not found')
          source = source.replace(narrow, narrow_new, 1)
          path.write_text(source)
          PY
          npm run format
          npm run lint
          npm run typecheck
      - name: Commit style pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/base.css
          git commit -m "style: clarify local persistence controls"
          git push origin HEAD:issue-8-versioned-state-persistence
