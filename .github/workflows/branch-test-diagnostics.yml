name: Temporary test diagnostics

on:
  push:
    branches:
      - issue-16-dsp-characterization

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-16-dsp-characterization
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture unit-test diagnostics
        run: npm test > .test.log 2>&1 || true
      - name: Capture representative characterization report
        run: npm run characterize -- --sample-rate 48000 --frames 16384 > .characterization-report.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .test.log .characterization-report.txt
          git commit -m "chore: capture test diagnostics [diagnostic-helper]" || exit 0
          git push origin HEAD:issue-16-dsp-characterization
