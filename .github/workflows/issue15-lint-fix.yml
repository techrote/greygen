name: Issue 15 lint fix

on:
  push:
    branches:
      - issue-15-lr-calibration-profiles

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-15-lr-calibration-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue15-lint-fix.py
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/calibration tests
          git commit -m "fix: make issue 15 calibration surfaces lint-clean"
          git push origin HEAD:issue-15-lr-calibration-profiles
