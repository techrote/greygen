name: Issue 14 format

on:
  push:
    branches:
      - issue-14-guided-calibration-wizard

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-14-guided-calibration-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run typecheck
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/issue14-format.yml'
          git commit -m "style: apply pinned issue 14 formatting"
          git push origin HEAD:issue-14-guided-calibration-wizard
