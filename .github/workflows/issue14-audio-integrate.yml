name: Issue 14 audio integrate

on:
  push:
    branches:
      - issue-14-guided-calibration-wizard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-14-guided-calibration-wizard
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue14_audio_patch.py
      - run: python scripts/issue14_audio_compat.py
      - run: npm run format
      - run: npm run typecheck
      - name: Commit audio integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio/dsp/engine.ts src/audio/protocol.ts src/audio/worklet/greygen-processor.ts src/audio/AudioEngine.ts
          git commit -m "feat: integrate transient guided calibration stimulus"
          git push origin HEAD:issue-14-guided-calibration-wizard
