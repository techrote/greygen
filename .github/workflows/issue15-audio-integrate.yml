name: Issue 15 audio integrate

on:
  push:
    branches:
      - issue-15-lr-calibration-profiles

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-15-lr-calibration-profiles
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue15_audio_patch.py
      - run: npm run format
      - run: npm run typecheck
      - name: Commit audio integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio
          git commit -m "feat: add real independent channel calibration DSP"
          git push origin HEAD:issue-15-lr-calibration-profiles
