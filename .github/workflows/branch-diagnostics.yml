name: Temporary branch diagnostics

on:
  push:
    branches:
      - issue-16-dsp-characterization

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-16-dsp-characterization
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Capture typecheck diagnostics
        run: npm run typecheck > .typecheck.log 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .typecheck.log
          git commit -m "chore: capture typecheck diagnostics [diagnostic-helper]" || exit 0
          git push origin HEAD:issue-16-dsp-characterization
