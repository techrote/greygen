name: Issue 7 lint fix

on:
  push:
    branches:
      - issue-7-primary-generator-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-7-primary-generator-ui
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix band-group semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app/App.tsx')
          source = app.read_text()
          opening = '''        <div
          className="band-scroll"
          tabIndex={0}
          aria-label="Ten frequency bands"
        >'''
          replacement = '''        <fieldset className="band-scroll">
          <legend className="sr-only">Ten frequency bands</legend>'''
          if opening not in source:
              raise SystemExit('expected band-scroll opening not found')
          source = source.replace(opening, replacement, 1)
          closing = '''          </div>
        </div>

        {highBandDegraded ? ('''
          closing_replacement = '''          </div>
        </fieldset>

        {highBandDegraded ? ('''
          if closing not in source:
              raise SystemExit('expected band-scroll closing not found')
          app.write_text(source.replace(closing, closing_replacement, 1))

          css = Path('src/styles/base.css')
          styles = css.read_text()
          needle = '''.band-scroll {
  overflow-x: auto;'''
          replacement_css = '''.band-scroll {
  min-width: 0;
  border: 0;
  overflow-x: auto;'''
          if needle not in styles:
              raise SystemExit('expected band-scroll styles not found')
          css.write_text(styles.replace(needle, replacement_css, 1))
          PY
          npm run format
          npm run lint
      - name: Commit lint fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/styles/base.css
          git commit -m "fix: use native band fieldset"
          git push origin HEAD:issue-7-primary-generator-ui
