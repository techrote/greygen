name: Issue 18 focused source repair

on:
  push:
    branches:
      - issue-18-accessibility-responsive

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply lifecycle focus and shortcut isolation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app/App.tsx')
          text = app.read_text()
          old = """  const [presetNameDraft, setPresetNameDraft] = useState('')\n  const [shareImportDraft, setShareImportDraft] = useState('')\n  const telemetry = audioSnapshot.telemetry\n"""
          new = """  const [presetNameDraft, setPresetNameDraft] = useState('')\n  const [shareImportDraft, setShareImportDraft] = useState('')\n  const primaryActionRef = useRef<HTMLButtonElement>(null)\n  const previousAudioStatusRef = useRef(audioSnapshot.status)\n  const telemetry = audioSnapshot.telemetry\n\n  useEffect(() => {\n    const previousStatus = previousAudioStatusRef.current\n    if (\n      previousStatus === 'starting' &&\n      audioSnapshot.status !== 'starting'\n    ) {\n      primaryActionRef.current?.focus()\n    }\n    previousAudioStatusRef.current = audioSnapshot.status\n  }, [audioSnapshot.status])\n"""
          assert text.count(old) == 1, 'GeneratorSurface insertion point changed'
          text = text.replace(old, new)
          old_button = """            <button\n              className=\"primary-action\"\n              type=\"button\"\n              disabled={primaryDisabled}\n"""
          new_button = """            <button\n              ref={primaryActionRef}\n              className=\"primary-action\"\n              type=\"button\"\n              disabled={primaryDisabled}\n"""
          assert text.count(old_button) == 1, 'primary transport button changed'
          app.write_text(text.replace(old_button, new_button))

          guided = Path('src/features/calibration/GuidedCalibrationWizard.tsx')
          text = guided.read_text()
          old_helper = """function isTextEntryTarget(target: EventTarget | null): boolean {\n  if (!(target instanceof HTMLElement)) {\n    return false\n  }\n  const tag = target.tagName.toLowerCase()\n  return tag === 'input' || tag === 'textarea' || tag === 'select'\n}\n"""
          new_helper = """function isNativeInteractiveTarget(target: EventTarget | null): boolean {\n  if (!(target instanceof HTMLElement)) {\n    return false\n  }\n  const tag = target.tagName.toLowerCase()\n  return (\n    tag === 'input' ||\n    tag === 'textarea' ||\n    tag === 'select' ||\n    tag === 'button' ||\n    tag === 'a'\n  )\n}\n"""
          assert text.count(old_helper) == 1, 'guided target helper changed'
          text = text.replace(old_helper, new_helper)
          old_handler = """    if (event.key === 'Escape') {\n      event.preventDefault()\n      abort()\n      return\n    }\n    if (isTextEntryTarget(event.target) || wizard.phase === 'review') {\n      return\n    }\n"""
          new_handler = """    if (isNativeInteractiveTarget(event.target)) {\n      return\n    }\n    if (event.key === 'Escape') {\n      event.preventDefault()\n      abort()\n      return\n    }\n    if (wizard.phase === 'review') {\n      return\n    }\n"""
          assert text.count(old_handler) == 1, 'guided keyboard handler changed'
          guided.write_text(text.replace(old_handler, new_handler))
          PY
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/features/calibration/GuidedCalibrationWizard.tsx
          git commit -m "fix: restore transport focus and isolate calibration shortcuts"
          git push
