name: Issue 8 type fix

on:
  push:
    branches:
      - issue-8-versioned-state-persistence

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-8-versioned-state-persistence
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tighten state parser narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/app/App.tsx')
          source = app.read_text()
          stale = '  createSpectrumState,\n'
          if stale not in source:
              raise SystemExit('stale createSpectrumState import not found')
          app.write_text(source.replace(stale, '', 1))

          state = Path('src/app/state/appState.ts')
          source = state.read_text()
          old = 'if (!isRecord(value) || !Number.isInteger(value.schemaVersion)) {'
          new = "if (\n    !isRecord(value) ||\n    typeof value.schemaVersion !== 'number' ||\n    !Number.isInteger(value.schemaVersion)\n  ) {"
          if source.count(old) != 3:
              raise SystemExit(f'expected 3 schema guards, found {source.count(old)}')
          state.write_text(source.replace(old, new))
          PY
          npm run format
          npm run lint
          npm run typecheck
      - name: Commit type fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/state/appState.ts
          git commit -m "fix: narrow persisted schema versions explicitly"
          git push origin HEAD:issue-8-versioned-state-persistence
