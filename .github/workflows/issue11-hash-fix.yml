name: Issue 11 hash fix

on:
  push:
    branches:
      - issue-11-presets-share-urls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-11-presets-share-urls
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: python scripts/issue11_hash_boot.py
      - run: npm run format
      - run: npm run typecheck
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx
          git commit -m "fix: make share fragments robust to strict and hash navigation"
          git push origin HEAD:issue-11-presets-share-urls
